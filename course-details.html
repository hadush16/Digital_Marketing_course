<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details | Digital Sunrise Ads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sticky-form { position: sticky; top: 100px; }
        .step-icon { width: 40px; height: 40px; background: #0d6efd; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
        .detail-header { background: #f8f9fa; border-bottom: 1px solid #eee; padding: 40px 0; }
        .benefit-card { border: none; background: #fff; border-left: 4px solid #0d6efd; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white border-bottom sticky-top">
    <div class="container">
        <a class="btn btn-outline-dark btn-sm rounded-pill" href="index.html"><i class="bi bi-arrow-left"></i> Home</a>
        <span class="navbar-brand fw-bold mx-auto">MODULE PREVIEW</span>
    </div>
</nav>

<header class="detail-header">
    <div class="container text-center">
        <h1 id="mod-title" class="display-4 fw-bold">...</h1>
        <p id="mod-subtitle" class="lead text-muted"></p>
    </div>
</header>

<div class="container py-5">
    <div class="row g-5">
        <div class="col-lg-8">
            <h3 class="fw-bold mb-4">What's Inside this Module?</h3>
            <div id="learning-content"></div>

            <h3 class="fw-bold mt-5 mb-4">Practical Lab Work</h3>
            <div class="card benefit-card p-4">
                <p id="mod-project" class="mb-0 fs-5"></p>
            </div>

            <div class="ad-slot my-5 py-4 border rounded bg-light text-center">
                <small class="text-muted">Advertisement</small>
                <div style="height: 100px; background: #eee; display: flex; align-items: center; justify-content: center;">
                    Google Ad Placeholder
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="sticky-form card p-4 shadow-lg border-0 rounded-4">
                <h4 class="fw-bold mb-3">Reserve Your Spot</h4>
                <div class="d-flex align-items-center mb-3">
                    <h2 class="text-success fw-bold mb-0" id="mod-price">--</h2>
                    <span class="text-decoration-line-through text-muted ms-2 small" id="old-price"></span>
                </div>
                <form id="regForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="tel" class="form-control" placeholder="Phone (WhatsApp)" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3">Enroll via WhatsApp</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted"><i class="bi bi-shield-lock-fill"></i> Secure via Telebirr / CBE</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const mod = urlParams.get('mod');

    const dataSet = {
        '4': {
            title: "Social Media Advertising Mastery",
            subtitle: "Run professional ads on Facebook, Instagram, TikTok & X.",
            price: "ETB 3,500",
            old: "ETB 5,000",
            learning: [
                "Setting up Meta Business Manager & TikTok Ad Center",
                "Crafting high-conversion Ad Copies & Creative Visuals",
                "Advanced Targeting: Lookalike audiences & Retargeting pixels",
                "Managing and Scaling daily ad budgets effectively"
            ],
            project: "Launch a live sample ad campaign and create a 7-day engagement plan to maximize ROI."
        },
        '5': {
            title: "Content Marketing & Storytelling",
            subtitle: "Master the art of brand psychology and content planning.",
            price: "ETB 2,000",
            old: "ETB 3,500",
            learning: [
                "The 4-Step Storytelling Framework for Brands",
                "Content Pillar Strategy: Never run out of ideas",
                "Graphic Design basics for social media marketing",
                "Video hooks for Reels and TikTok"
            ],
            project: "Develop a full-month branded content calendar for a local business to increase organic traffic."
        },
        '6': {
            title: "Search Engine Marketing (SEO & SEM)",
            subtitle: "Dominate Google search results organically and through ads.",
            price: "ETB 4,000",
            old: "ETB 6,000",
            learning: [
                "Keyword Research: Finding what people in Ethiopia are searching",
                "On-Page SEO: Optimizing titles, meta tags, and content",
                "Google Search Ads: Setting up campaigns and bidding",
                "Tracking rankings and website health audits"
            ],
            project: "Complete an SEO audit of a live website and set up a Google PPC campaign plan."
        },
        '7': {
            title: "Email, Influencer & Mobile",
            subtitle: "Direct outreach and mobile-first marketing techniques.",
            price: "ETB 2,500",
            old: "ETB 3,800",
            learning: [
                "Email Automation: Building lists and newsletters",
                "Influencer Marketing: Finding and vetting creators",
                "WhatsApp Business Marketing: Direct sales techniques",
                "SMS & Mobile Ad Strategies"
            ],
            project: "Create a professional influencer outreach plan and a 3-part email sales sequence."
        },
        '9': {
            title: "Data Analytics & Digital Metrics",
            subtitle: "The science of measuring digital marketing success.",
            price: "ETB 4,500",
            old: "ETB 7,000",
            learning: [
                "Google Analytics 4 (GA4) Professional Setup",
                "Installing Tracking Pixels for Meta and Google",
                "ROI Calculation: Understanding Cost Per Acquisition (CPA)",
                "Reporting: Creating dashboards for clients"
            ],
            project: "Measure live engagement data and present an ROI report for a digital campaign."
        }
    };

    const modData = dataSet[mod];
    if (modData) {
        document.getElementById('mod-title').innerText = modData.title;
        document.getElementById('mod-subtitle').innerText = modData.subtitle;
        document.getElementById('mod-price').innerText = modData.price;
        document.getElementById('old-price').innerText = modData.old;
        document.getElementById('mod-project').innerText = modData.project;

        let learnHtml = '';
        modData.learning.forEach((item, index) => {
            learnHtml += `<div class="d-flex align-items-start mb-4">
                            <div class="step-icon">${index + 1}</div>
                            <div><h5 class="fw-bold mb-1">${item}</h5><p class="text-muted small">Learn the industry standards and best practices.</p></div>
                          </div>`;
        });
        document.getElementById('learning-content').innerHTML = learnHtml;
    }

    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert("Success! We are redirecting you to WhatsApp for final registration.");
        window.location.href = "https://wa.me/251714224955";
    });
</script>
</body>
</html>
