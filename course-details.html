<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .visual-header { background: #000; color: #fff; padding: 60px 0; border-radius: 0 0 50px 50px; }
        .skill-bar { height: 8px; border-radius: 10px; background: #eee; margin-bottom: 20px; }
        .skill-progress { height: 100%; border-radius: 10px; background: #0d6efd; width: 0; transition: 1.5s; }
        .project-box { border-left: 5px solid #0d6efd; background: #f0f7ff; padding: 20px; border-radius: 0 15px 15px 0; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <a href="index.html" class="btn btn-dark btn-sm"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
</div>

<header class="visual-header mt-3">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 id="mod-title" class="display-4 fw-bold">...</h1>
                <p id="mod-subtitle" class="lead text-secondary">Loading details...</p>
            </div>
            <div class="col-md-4 text-center">
                <i id="mod-icon" class="bi bi-gear-fill display-1 text-primary"></i>
            </div>
        </div>
    </div>
</header>

<main class="container py-5">
    <div class="row g-5">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-4">Detailed Learning Path</h3>
            <div id="learning-items"></div>
            
            <div class="project-box mt-5">
                <h5 class="fw-bold"><i class="bi bi-mortarboard-fill"></i> Major Project</h5>
                <p id="mod-project" class="mb-0"></p>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 20px;">
                <h5 class="fw-bold mb-4">Skills You Will Master</h5>
                <div id="skills-section"></div>
                <hr>
                <div class="text-center">
                    <h3 class="fw-bold text-success" id="mod-price">--</h3>
                    <a href="contact.html" class="btn btn-primary btn-lg w-100 mt-3">Enroll & Start Now</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const mod = urlParams.get('mod');

    const courseData = {
        '4': {
            title: "Social Media Advertising",
            subtitle: "Facebook, Instagram, X, and TikTok Advertising Excellence",
            icon: "bi-megaphone",
            color: "#0d6efd",
            price: "ETB 3,500",
            learning: ["Meta Business Suite Expert Setup", "TikTok Ad Creative Strategies", "X (Twitter) Bidding Mastery", "Targeting Lookalike Audiences"],
            skills: [{name: "Ad Creation", p: "95%"}, {name: "Campaign Budgeting", p: "85%"}, {name: "Audience Tuning", p: "90%"}],
            project: "Build a multi-platform ad campaign for an Ethiopian Startup with a sample budget of 500 ETB/day."
        },
        '5': {
            title: "Content Marketing & Stories",
            subtitle: "Psychological Branding & Storytelling Frameworks",
            icon: "bi-pen",
            color: "#198754",
            price: "ETB 2,000",
            learning: ["The AIDA Storytelling Framework", "Copywriting for Conversions", "Developing Brand Identity", "Content Pillar Strategies"],
            skills: [{name: "Creative Writing", p: "90%"}, {name: "Branding", p: "80%"}, {name: "Visual Design", p: "70%"}],
            project: "Develop a 30-day branded content strategy for a local retail shop, including captions and hooks."
        },
        '6': {
            title: "Search Engine Mastery",
            subtitle: "Ranking #1 on Google with SEO and SEM",
            icon: "bi-search",
            color: "#ffc107",
            price: "ETB 4,000",
            learning: ["Advanced Keyword Research", "On-Page Metadata Secrets", "Backlinking & Technical SEO", "Google Search Paid Ads"],
            skills: [{name: "Google SEO", p: "85%"}, {name: "Keyword Analysis", p: "95%"}, {name: "AdWords Setup", p: "80%"}],
            project: "Perform a full SEO audit on a website and launch a test Google Search Campaign."
        },
        '7': {
            title: "Modern Channel Marketing",
            subtitle: "Email, Influencer Outreach, and Mobile Strategy",
            icon: "bi-people",
            color: "#0dcaf0",
            price: "ETB 2,500",
            learning: ["Influencer Scouting & Negotiation", "Email Marketing Automation", "WhatsApp Business Strategy", "Mobile-First Marketing"],
            skills: [{name: "Outreach", p: "90%"}, {name: "Email Design", p: "75%"}, {name: "Negotiation", p: "85%"}],
            project: "Design an influencer outreach program and an automated email welcome series."
        },
        '9': {
            title: "Data Analytics & ROI",
            subtitle: "The Science of Digital Marketing Decisions",
            icon: "bi-graph-up-arrow",
            color: "#dc3545",
            price: "ETB 4,500",
            learning: ["Google Analytics 4 Setup", "Meta Pixel & Event Tracking", "A/B Split Testing Data", "Calculating CAC and ROI"],
            skills: [{name: "Data Analysis", p: "95%"}, {name: "Spreadsheet Reports", p: "90%"}, {name: "Optimization", p: "85%"}],
            project: "Analyze a failing ad campaign, identify the leak, and present a data-backed solution for ROI."
        }
    };

    const data = courseData[mod];
    if (data) {
        document.getElementById('mod-title').innerText = data.title;
        document.getElementById('mod-subtitle').innerText = data.subtitle;
        document.getElementById('mod-icon').className = `bi ${data.icon} display-1`;
        document.getElementById('mod-icon').style.color = data.color;
        document.getElementById('mod-price').innerText = data.price;
        document.getElementById('mod-project').innerText = data.project;

        let learnHtml = '';
        data.learning.forEach(item => {
            learnHtml += `<div class="d-flex mb-3"><i class="bi bi-check-circle-fill text-primary me-2"></i><span>${item}</span></div>`;
        });
        document.getElementById('learning-items').innerHTML = learnHtml;

        let skillHtml = '';
        data.skills.forEach(s => {
            skillHtml += `<small class="fw-bold">${s.name}</small>
                          <div class="skill-bar"><div class="skill-progress" style="width: ${s.p}; background: ${data.color}"></div></div>`;
        });
        document.getElementById('skills-section').innerHTML = skillHtml;
    }
</script>
</body>
</html>
