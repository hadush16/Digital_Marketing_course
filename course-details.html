<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details | Digital Sunrise</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3237559839274253" crossorigin="anonymous"></script>
    <script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background: #050608; color: #fff; }
        .detail-header { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1000&q=80'); background-size: cover; padding: 100px 0 60px; border-bottom: 2px solid #00d2ff; }
        .sticky-box { position: sticky; top: 100px; }
        .list-item { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 1.5rem; margin-bottom: 1rem; border-left: 4px solid #00d2ff; }
        .form-control { background: #111; border: 1px solid #333; color: #fff; }
        .form-control:focus { background: #111; border-color: #00d2ff; color: #fff; box-shadow: none; }
    </style>
</head>
<body>
    <amp-auto-ads type="adsense" data-ad-client="ca-pub-3237559839274253"></amp-auto-ads>

    <header class="detail-header text-center">
        <div class="container">
            <h1 id="m-title" class="display-3 fw-bold">...</h1>
            <p id="m-sub" class="fs-5 text-info"></p>
        </div>
    </header>

    <div class="container py-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <h3 class="fw-bold mb-4">Curriculum Details</h3>
                <div id="m-list"></div>
                
                <h3 class="fw-bold mt-5 mb-4">Practical Project</h3>
                <div class="p-4 rounded-4 bg-primary bg-opacity-10 border border-primary">
                    <p id="m-project" class="fs-5 mb-0"></p>
                </div>

                <div class="my-5 text-center bg-dark p-3 rounded">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3237559839274253" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="sticky-box">
                    <div class="card bg-dark border-secondary p-4 rounded-4 shadow-lg">
                        <h4 class="fw-bold">Reserve Seat</h4>
                        <h2 class="text-info fw-bold mb-4" id="m-price">--</h2>
                        <form id="regForm">
                            <input type="text" class="form-control mb-3" placeholder="Full Name" required>
                            <input type="tel" class="form-control mb-3" placeholder="WhatsApp Number" required>
                            <button class="btn btn-info w-100 fw-bold py-3 text-white">SUBMIT REGISTRATION</button>
                        </form>
                        <div class="mt-4 pt-4 border-top border-secondary text-center">
                            <small class="text-secondary">Official training by Hadush Brhane</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mod = urlParams.get('mod');
        const content = {
            '4': {
                t: "Social Media Platforms for Advertising",
                s: "Facebook, Instagram, X (Twitter), TikTok",
                p: "ETB 3,500",
                list: ["Create sample social media ads", "Engagement Plan Strategy", "Budget Scaling & Bidding", "TikTok Creative Center Guide"],
                proj: "Design and launch 3 sample ads for a local business with a specific ROI target."
            },
            '9': {
                t: "Data Analytics & Digital Metrics",
                s: "Google Analytics & Meta Ads Manager",
                p: "ETB 4,500",
                list: ["Practical session on ROI", "Measuring conversion events", "Google Analytics 4 setup", "Meta Pixel implementation"],
                proj: "Develop a full measurement dashboard for a campaign and calculate CPA."
            }
            // Add 5, 6, 7 here...
        };

        const d = content[mod];
        if(d) {
            document.getElementById('m-title').innerText = d.t;
            document.getElementById('m-sub').innerText = d.s;
            document.getElementById('m-price').innerText = d.p;
            document.getElementById('m-project').innerText = d.proj;
            let html = '';
            d.list.forEach(i => html += `<div class="list-item"><h5>${i}</h5></div>`);
            document.getElementById('m-list').innerHTML = html;
        }

        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Redirecting to WhatsApp for confirmation...");
            window.location.href = "https://wa.me/251714224955";
        });
    </script>
</body>
</html>
