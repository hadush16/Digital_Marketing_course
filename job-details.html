<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details | Jobs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #003366; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 25px 0; }
        .meta-item { background: #f1f5f9; padding: 15px; border-radius: 8px; text-align: center; }
        .meta-item strong { display: block; font-size: 0.7rem; color: var(--primary); text-transform: uppercase; }
        
        .apply-section { border-top: 2px solid #eee; margin-top: 30px; padding-top: 30px; }
        .btn { display: block; text-align: center; padding: 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .btn-active { background: var(--primary); color: white; }
        .btn-disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; pointer-events: none; }
        .expired-msg { color: var(--danger); font-weight: bold; text-align: center; margin-bottom: 10px; }
    </style>

     <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1190706248323157"
     crossorigin="anonymous"></script>
    <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</head>
<body>
    <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-1190706248323157">
</amp-auto-ads>

    <div class="card">
        <a href="index.html" style="text-decoration:none; color:var(--primary); font-weight:bold;">← Back to Portal</a>
        
        <h1 id="title" style="margin: 25px 0 5px 0;"></h1>
        <p id="company" style="font-size: 1.3rem; color: #64748b; margin: 0;"></p>

        <div class="meta-grid">
            <div class="meta-item"><strong>Location</strong><span id="place"></span></div>
            <div class="meta-item"><strong>Level</strong><span id="level"></span></div>
            <div class="meta-item"><strong>Needed</strong><span id="needed"></span></div>
            <div class="meta-item"><strong>Deadline</strong><span id="deadline"></span></div>
        </div>

        <h3>Description</h3>
        <p id="desc">Full job description text goes here...</p>

        <div class="apply-section">
            <h3>How to Apply</h3>
            <p id="instr"></p>
            <div id="applyArea"></div>
        </div>
    </div>

    <script>
        // COPY THIS DATA FROM INDEX.HTML FOR CONSISTENCY
        const fullData = {
            "1": { 
                title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            },
            "2": { 
                title: "Software Engineer", company: "Safaricom", place: "Remote", level: "Mid", needed: "1", deadline: "2025-12-20",
                desc: "Join our core network engineering team...",
                instr: "Apply via our official Safaricom Career portal.",
                type: "link", action: "https://safaricom.et/careers"
            },
            "3": { 
                title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            }, "4": { 
                 title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            }, "5": { 
                title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            },
             "6": { 
                 title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            },
             "7": { 
                 title: "Senior Auditor", company: "Abyssinia Bank", place: "Addis Ababa", level: "Senior", needed: "3", deadline: "2025-12-30",
                desc: "We need a Senior Auditor to lead our internal control systems...",
                instr: "Please send your CV and scanned degree to the link below.",
                type: "email", action: "hr@abyssinia.com"
            }
            
        };

        const id = new URLSearchParams(window.location.search).get('id');
        const job = fullData[id];

        if(job) {
            document.getElementById('title').innerText = job.title;
            document.getElementById('company').innerText = job.company;
            document.getElementById('place').innerText = job.place;
            document.getElementById('level').innerText = job.level;
            document.getElementById('needed').innerText = job.needed + " Positions";
            document.getElementById('deadline').innerText = job.deadline;
            document.getElementById('instr').innerText = job.instr;

            const isExpired = new Date(job.deadline) < new Date();
            const area = document.getElementById('applyArea');

            if(isExpired) {
                area.innerHTML = `<div class="expired-msg">This vacancy has expired and is no longer accepting applications.</div>
                                  <div class="btn btn-disabled">Applications Closed</div>`;
            } else {
                const link = job.type === 'email' ? `mailto:${job.action}` : job.action;
                const label = job.type === 'email' ? "Apply via Email" : "Apply on Official Website";
                area.innerHTML = `<a href="${link}" class="btn btn-active">${label}</a>`;
            }
        }
    </script>
</body>
</html>
