<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #003366; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .header { background: var(--primary); color: white; padding: 40px 5%; text-align: center; }
        .container { max-width: 900px; margin: -30px auto 0; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .back-link { color: white; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        
        h2 { color: var(--primary); border-left: 4px solid var(--primary); padding-left: 15px; margin-top: 30px; }
        .apply-box { background: #fffbeb; border: 2px dashed #f59e0b; padding: 25px; border-radius: 12px; margin-top: 40px; }
        .apply-box h3 { color: #92400e; margin-top: 0; }
        .btn-apply { display: block; width: 100%; background: var(--primary); color: white; text-align: center; padding: 18px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 20px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-link">← Back to Portal</a>
        <h1 id="jTitle">Job Loading...</h1>
        <p id="jCompany"></p>
    </div>

    <div class="container">
        <div class="card">
            <div id="jDetails">
                </div>

            <div class="apply-box">
                <h3><i class="fa fa-paper-plane"></i> How to Apply</h3>
                <p id="jApply"></p>
                <a href="#" id="jEmail" class="btn-apply">Send Application Email</a>
            </div>
        </div>
    </div>

    <script>
        const fullData = {
            "1": { 
                title: "Corporate Branch Manager", 
                company: "Abyssinia Bank", 
                desc: "Lead the branch operations and financial growth targets for our central district.",
                req: "Master's in Finance, 8+ years experience in banking operations.",
                apply: "Interested candidates should submit their CV and a cover letter to the HR department via the email link below. Mention 'Branch Manager Application' in the subject line.",
                email: "hr@abyssiniabank.com"
            },
            "2": { 
                title: "Fullstack Developer", 
                company: "E-Tech Ethiopia", 
                desc: "Develop and maintain robust web applications using Node.js and React.",
                req: "BSc in Computer Science, Portfolio of at least 3 active projects.",
                apply: "Send your GitHub profile and resume. Shortlisted candidates will be contacted for a technical interview.",
                email: "tech@etech.et"
            }
            // Add more IDs for 3, 4, 5, 6...
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const job = fullData[id];

        if(job) {
            document.getElementById('jTitle').innerText = job.title;
            document.getElementById('jCompany').innerText = job.company;
            document.getElementById('jDetails').innerHTML = `
                <h2>Description</h2><p>${job.desc}</p>
                <h2>Requirements</h2><p>${job.req}</p>
            `;
            document.getElementById('jApply').innerText = job.apply;
            document.getElementById('jEmail').href = `mailto:${job.email}?subject=Application for ${job.title}`;
        }
    </script>
</body>
</html>
