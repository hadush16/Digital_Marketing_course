<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioJobs Portal | Dec 2025</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h2>EthioJobs</h2>
        </div>
        <ul>
            <li onclick="filterJobs('all')"><i class="fa fa-home"></i> Home</li>
            <li onclick="filterJobs('banking')"><i class="fa fa-university"></i> Banking</li>
            <li onclick="filterJobs('tech')"><i class="fa fa-laptop-code"></i> Technology</li>
            <li onclick="filterJobs('health')"><i class="fa fa-stethoscope"></i> Healthcare</li>
        </ul>
    </nav>

    <header>
        <button id="menuBtn"><i class="fa fa-bars"></i></button>
        <div class="search-box">
            <input type="text" id="jobSearch" placeholder="Search by job title or company...">
        </div>
    </header>

    <div class="container">
        <h2>Latest Job Vacancies</h2>
        
        <div id="jobList">
            <div class="job-card" 
                 data-category="banking" 
                 data-title="Branch Manager"
                 data-company="Commercial Bank of Ethiopia"
                 data-desc="Manage daily branch operations and customer relations."
                 data-req="BA in Management, 5+ years experience."
                 data-loc="Addis Ababa">
                <span class="badge senior">Senior</span>
                <h3>Branch Manager</h3>
                <p>CBE • Addis Ababa</p>
                <button class="view-btn">View Details</button>
            </div>

            </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalCompany" class="company-name"></p>
            <hr>
            <h4>Description</h4>
            <p id="modalDesc"></p>
            <h4>Requirements</h4>
            <p id="modalReq"></p>
            <p><strong>Location:</strong> <span id="modalLoc"></span></p>
            <a href="mailto:apply@example.com" class="apply-btn">Apply Now</a>
        </div>
    </div>

    <div id="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
