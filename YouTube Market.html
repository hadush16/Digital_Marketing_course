<style>

body{
margin:0;
font-family:Inter,Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}
  .thumb-container {
        position: relative;
        width: 100%;
        height: 200px;
        overflow: hidden;
    }

    .thumb-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .card:hover .thumb-container img {
        transform: scale(1.1);
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #ef4444;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: bold;
        text-transform: uppercase;
    }

    .stats {
        display: flex;
        gap: 15px;
        margin: 10px 0;
        font-size: 0.85rem;
        color: #94a3b8;
    }

    .stats i { color: #25D366; }
</style>

<script>
AOS.init();

/* HERO */

.hero{
text-align:center;
padding:90px 5%;
}

.hero h1{
font-size:3rem;
margin-bottom:10px;
}

.hero p{
opacity:.8;
}

.cta{
margin-top:25px;
}

.cta a{
background:#25D366;
padding:14px 28px;
border-radius:40px;
color:white;
text-decoration:none;
font-weight:bold;
}

/* GLASS CARD */

.container{
padding:50px 5%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.card{
backdrop-filter:blur(15px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
border-radius:16px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.3);
transition:.4s;
}

.card:hover{
transform:translateY(-8px);
}

.thumb{
width:100%;
height:200px;
object-fit:cover;
}

.card-body{
padding:20px;
}

.card-body h3{
margin-top:0;
}

.video{
width:100%;
height:200px;
border:none;
border-radius:10px;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.btn{
padding:8px 15px;
border-radius:20px;
text-decoration:none;
font-size:.85rem;
font-weight:bold;
}

.watch{background:#2563eb;color:white;}
.buy{background:#25D366;color:white;}

footer{
