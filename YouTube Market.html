<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium YouTube Marketplace</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* Light Mode Variables (Default) */
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-dim: #475569;
            --primary: #2563eb;
            --secondary: #25D366;
            --card-bg: #ffffff;
            --glass: rgba(0, 0, 0, 0.03);
            --border: #e2e8f0;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg: #0f172a;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Theme Toggle Button */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hero {
            text-align: center;
            padding: 120px 20px 60px;
            background: linear-gradient(0deg, var(--bg) 0%, rgba(15, 23, 42, 0) 100%);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 8vw, 4rem);
            margin-bottom: 20px;
            font-weight: 900;
            color: var(--text-main);
        }

        .hero .amharic-text {
            font-size: 1.2rem;
            color: var(--secondary);
            max-width: 700px;
            margin: 0 auto 30px;
            line-height: 1.8;
            border-left: 4px solid var(--secondary);
            padding-left: 20px;
            text-align: left;
        }

        .container {
            padding: 20px 5% 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: transform 0.4s ease;
            height: 480px;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-10px); }

        .media-container {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .thumb-img { width: 100%; height: 100%; object-fit: cover; }

        .sliding-desc {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 30px;
            box-sizing: border-box;
            transition: 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 5;
            color: var(--text-main);
        }

        .card:hover .sliding-desc { bottom: 0; }

        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sub-count {
            background: rgba(37, 211, 102, 0.1);
            color: var(--secondary);
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            color: white;
            z-index: 2;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px 5px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-details { background: var(--primary); color: white; }
        .btn-buy { background: var(--secondary); color: white; }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<button class="theme-switch" onclick="toggleTheme()">
    <i class="fas fa-moon" id="theme-icon"></i>
</button>

<section class="hero" data-aos="fade-down">
    <h1>Premium YouTube Assets</h1>
    <div class="amharic-text">
        ብ ዶላር ($) ዝኸፍል YouTube ቻነል ክህልዎም ይደልዩ ዶ?<br>
        ብዝሓሰረ ዋጋ ወናኒ ይኹኑ። ቀዲሙ ዝመፀ ወሰደ!
    </div>
    <a href="https://wa.me/251961224955" style="background:var(--secondary); color:white; padding:15px 30px; border-radius:50px; text-decoration:none; font-weight:bold;">
        <i class="fab fa-whatsapp"></i> Contact Us
    </a>
</section>

<div class="container" id="channelGrid"></div>

<footer>
    <p>© 2026 YouTube Marketplace | Safe Transfers</p>
</footer>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    const channels = [
        { id: 1, title: "Worlds Music", desc: "Focuses on Ethiopian and global cultural hits.", image: "assets/img/world.png", subs: "7,260", status: "Monetized", video: "qe3A-w1PyJI" },
        { id: 2, title: "AGA BEST MUSIC", desc: "The ultimate hub for Ethiopian music lovers.", image: "assets/img/agabest.jpg", subs: "1,270", status: "Monetized", video: "_cWvKvR5Lc8" },
        { id: 3, title: "AGA ENTERTAINMENT", desc: "AI-driven content and trending entertainment.", image: "assets/aga.jpg", subs: "7,230", status: "Monetized", video: "DEy4Dmv8ZsY" },
        { id: 4, title: "Senay Show ሰናይ ሸዉ", desc: "Top Tigrigna entertainment and weddings.", image: "assets/img/senay.png", subs: "16,600", status: "Monetized", video: "aURwYK4lLn4" },
        { id: 5, title: "Nota ኖታ ENT", desc: "Growing entertainment niche. Clean history.", image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400", subs: "5,400", status: "Ready", video: "8Zm_SNikBUo" }
    ];

    function renderChannels() {
        const grid = document.getElementById("channelGrid");
        channels.forEach(ch => {
            const ytThumb = `https://img.youtube.com/vi/${ch.video}/maxresdefault.jpg`;
            grid.innerHTML += `
                <div class="card" data-aos="fade-up">
                    <div class="badge" style="background:${ch.status === 'Monetized' ? '#ef4444' : '#2563eb'}">${ch.status}</div>
                    <div class="sliding-desc">
                        <h4>Overview</h4>
                        <p>${ch.desc}</p>
                    </div>
                    <div class="media-container">
                        <img src="${ch.image}" onerror="this.src='${ytThumb}'" class="thumb-img">
                    </div>
                    <div class="card-body">
                        <h3>${ch.title}</h3>
                        <div class="stats-row"><span class="sub-count">${ch.subs} Subs</span></div>
                        <div class="actions">
                            <a href="channel-details.html?id=${ch.id}" class="btn btn-details">View Details</a>
                            <a href="https://wa.me/251961224955?text=Buy ${ch.title}" class="btn btn-buy">Buy Now</a>
                        </div>
                    </div>
                </div>`;
        });
    }

    // Theme Toggle Function
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const targetTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", targetTheme);
        document.getElementById("theme-icon").className = targetTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
        localStorage.setItem("theme", targetTheme);
    }

    // Load Theme Preference
    window.onload = () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
        document.getElementById("theme-icon").className = savedTheme === "dark" ? "fas fa-sun" : "fas fa-moon";
        AOS.init();
        renderChannels();
    };
</script>
</body>
</html>
