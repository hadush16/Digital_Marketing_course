<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Marketplace | Premium Assets</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* Light Mode */
            --bg: #f8fafc;
            --header-bg: #ffffff;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --secondary: #22c55e;
            --border: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg: #020617;
            --header-bg: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --secondary: #25D366;
            --border: #334155;
            --glass-bg: rgba(15, 23, 42, 0.8);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            transition: 0.3s ease;
        }

        /* --- PREMIUM HEADER --- */
        header {
            background: var(--header-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* --- THEME TOGGLE --- */
        .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        /* --- HERO SECTION --- */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
            color: white;
            margin-bottom: 40px;
        }

        .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; font-weight: 800; }
        .hero p { opacity: 0.9; font-size: 1.2rem; margin-top: 10px; }

        .container {
            padding: 0 5% 80px;
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* --- ENHANCED CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            height: 520px;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.15);
            border-color: var(--primary);
        }

        .media-container {
            height: 220px;
            position: relative;
            overflow: hidden;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .media-container img { transform: scale(1.1); }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            color: white;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- SLIDING GLASS OVERLAY --- */
        .sliding-desc {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 220px; /* Same as image */
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transition: 0.4s;
            z-index: 5;
        }

        .card:hover .sliding-desc { opacity: 1; }

        .card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-tag {
            background: var(--bg);
            padding: 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid var(--border);
        }

        /* --- ACTIONS --- */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            position: relative;
            z-index: 20;
        }

        .btn {
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-details { background: var(--primary); color: white; }
        .btn-buy { background: var(--secondary); color: white; }
        .btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        footer {
            text-align: center;
            padding: 60px 20px;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <i class="fab fa-youtube" style="color: #ff0000; font-size: 2rem;"></i>
            <span>YT Market</span>
        </a>
        <div class="header-actions">
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
            <a href="https://wa.me/251961224955" class="btn btn-buy" style="padding: 10px 20px;">
                <i class="fab fa-whatsapp"></i> Support
            </a>
        </div>
    </header>

    <section class="hero">
        <h1 data-aos="fade-down">Premium YouTube Assets</h1>
        <p data-aos="fade-up">ዝተረጋገጹን ብዶላር ($) ዝኸፍሉን ቻነላት ብዝሓሰረ ዋጋ!</p>
    </section>

    <div class="container" id="channelGrid"></div>

    <footer>
        <p>© 2026 YouTube Premium Assets Marketplace</p>
        <p style="font-size: 0.8rem; color: var(--text-dim);">Safe & Secure Channel Transfers Globally</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        const channels = [
            { id: 1, title: "Worlds Music", subs: "7,260", status: "Monetized", video: "qe3A-w1PyJI", desc: "Top-tier AI music channel. High organic traffic and zero strikes.", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" },
            { id: 2, title: "AGA Best Music", subs: "1,270", status: "Active", video: "_cWvKvR5Lc8", desc: "The ultimate hub for Ethiopian music lovers. High watch time.", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500" },
            { id: 3, title: "AGA Entertainment", subs: "7,230", status: "Monetized", video: "DEy4Dmv8ZsY", desc: "Focuses on viral entertainment news. Revenue generating daily.", img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500" },
            { id: 4, title: "Senay Show ሰናይ ሸዉ", subs: "16,600", status: "Monetized", video: "aURwYK4lLn4", desc: "Premier cultural show. Massive loyal community and engagement.", img: "https://www.youtube.com/watch?v=Pb5UXBihEvI" },
            { id: 5, title: "Nota ኖታ ENT", subs: "5,400", status: "Active", video: "8Zm_SNikBUo", desc: "Great starter channel for reaction content. Clean copyright.", img: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=500" }
        ];

        function renderChannels() {
            const grid = document.getElementById("channelGrid");
            channels.forEach(ch => {
                grid.innerHTML += `
                <div class="card" onclick="location.href='channel-details.html?id=${ch.id}'" data-aos="fade-up">
                    <div class="badge" style="background: ${ch.status === 'Monetized' ? '#ef4444' : '#2563eb'}">${ch.status}</div>
                    
                    <div class="media-container">
                        <img src="${ch.img}" alt="${ch.title}">
                        <div class="sliding-desc">
                            <strong>Detailed Insight:</strong>
                            <p>${ch.desc}</p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div>
                            <h3 class="card-title">${ch.title}</h3>
                            <div class="stats-grid">
                                <div class="stat-tag"><i class="fas fa-users"></i> ${ch.subs}</div>
                                <div class="stat-tag"><i class="fas fa-dollar-sign"></i> High CPM</div>
                            </div>
                        </div>
                        
                        <div class="actions">
                            <a href="channel-details.html?id=${ch.id}" class="btn btn-details" onclick="event.stopPropagation()">
                                <i class="fas fa-info-circle"></i> Details
                            </a>
                            <a href="https://wa.me/251961224955?text=Buy ${ch.title}" class="btn btn-buy" onclick="event.stopPropagation()">
                                <i class="fab fa-whatsapp"></i> Buy
                            </a>
                        </div>
                    </div>
                </div>`;
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById("themeBtn");
            const isLight = html.getAttribute("data-theme") === "light";
            const target = isLight ? "dark" : "light";
            html.setAttribute("data-theme", target);
            btn.innerHTML = target === "dark" ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem("theme", target);
        }

        window.onload = () => {
            const saved = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", saved);
            document.getElementById("themeBtn").innerHTML = saved === "dark" ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            AOS.init({ once: true });
            renderChannels();
        };
    </script>
</body>
</html>
