<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Channel Marketplace | Premium Assets</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --secondary: #25D366;
            --dark-bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 100px 5% 60px;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .cta a {
            background: var(--secondary);
            padding: 16px 32px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        .cta a:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }

        /* GRID SYSTEM */
        .container {
            padding: 20px 5% 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* EYE-CATCHING CARDS */
        .card {
            backdrop-filter: blur(20px);
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-12px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* MEDIA AREA (IMAGE + OVERLAYS) */
        .media-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover .thumb-img {
            opacity: 0.4;
            transform: scale(1.1);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 2;
        }

        .monetized { background: #ef4444; }

        /* PLAY OVERLAY */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 3;
        }

        .card:hover .play-overlay { opacity: 1; }

        /* CARD BODY */
        .card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body h3 {
            margin: 0 0 10px;
            font-size: 1.4rem;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #25D366;
            font-weight: 600;
        }

        .desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
        }

        .btn {
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-details { background: rgba(255,255,255,0.1); color: white; }
        .btn-buy { background: var(--secondary); color: white; }

        .btn:hover { filter: brightness(1.2); }

        footer {
            text-align: center;
            padding: 50px;
            border-top: 1px solid var(--glass);
            color: #64748b;
        }

        /* CUSTOM ANIMATION FOR WHITE SCREEN FIX */
        #channelGrid { min-height: 400px; }
    </style>
</head>
<body>

<section class="hero" data-aos="zoom-out">
    <h1>YouTube Channel Marketplace</h1>
    <p>Premium, monetized, and aged YouTube channels ready for your next big project. High growth potential with established audiences.</p>
    <div class="cta">
        <a href="https://wa.me/251961224955">
            <i class="fab fa-whatsapp"></i> Chat with an Agent
        </a>
    </div>
</section>

<div class="container" id="channelGrid">
    </div>

<footer>
    <p>© 2026 YouTube Channel Marketplace | Secure Digital Asset Transfers</p>
    <p><i class="fas fa-phone"></i> +251 961 224 955</p>
</footer>

<script>
    // YouTube URL helper to extract ID
    function getID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    const channels = [
        {
            id: 1,
            title: "Worlds Music",
            desc: "Premium global music channel. High engagement rate with a focus on world hits and local cultural melodies.",
            image: "assets/img/senay.png",
            subs: "7,150",
            status: "Monetized",
            video: "https://www.youtube.com/watch?v=qe3A-w1PyJI"
        },
        {
            id: 2,
            title: "AGA BEST ETHIOPIAN MUSIC",
            desc: "The ultimate hub for Ethiopian music lovers. Perfect for promoters or artists looking for an established base.",
            image: "assets/img/agabest.jpg",
            subs: "1,260",
            status: "Active",
            video: "https://www.youtube.com/watch?v=_cWvKvR5Lc8"
        },
        {
            id: 3,
            title: "AGA ENTERTAINMENT",
            desc: "AI-driven music entertainment and viral trending content. High automation potential for passive income.",
            image: "assets/aga-ent.jpg",
            subs: "7,230",
            status: "Monetized",
            video: "https://www.youtube.com/watch?v=DEy4Dmv8ZsY"
        },
        {
            id: 4,
            title: "Senay Show ሰናይ ሸዉ",
            desc: "Top-tier Tigrigna entertainment! Featuring weddings, drama, and trending news with a loyal fan base.",
            image: "assets/img/senay.png",
            subs: "16,600",
            status: "Monetized",
            video: "https://www.youtube.com/watch?v=aURwYK4lLn4"
        },
        {
            id: 5,
            title: "Nota ኖታ ENT",
            desc: "A rising star in the entertainment niche. Great SEO and search traffic performance over the last 90 days.",
            image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400", 
            subs: "5,400",
            status: "Ready",
            video: "https://www.youtube.com/watch?v=8Zm_SNikBUo"
        }
    ];

    const grid = document.getElementById("channelGrid");

    function renderChannels() {
        grid.innerHTML = '';
        channels.forEach(ch => {
            const vId = getID(ch.video);
            // Dynamic fallback to YouTube Thumbnail if your local image isn't found
            const previewImg = ch.image; 
            const youtubeThumb = `https://img.youtube.com/vi/${vId}/maxresdefault.jpg`;

            grid.innerHTML += `
            <div class="card" data-aos="fade-up">
                <div class="media-container">
                    <div class="badge ${ch.status === 'Monetized' ? 'monetized' : ''}">
                        ${ch.status}
                    </div>
                    <img src="${previewImg}" 
                         class="thumb-img" 
                         onerror="this.src='${youtubeThumb}'"
                         alt="${ch.title}">
                    <div class="play-overlay">
                        <i class="fas fa-play-circle fa-4x text-white"></i>
                    </div>
                </div>

                <div class="card-body">
                    <h3>${ch.title}</h3>
                    <div class="stats">
                        <span><i class="fas fa-users"></i> ${ch.subs} Subscribers</span>
                    </div>
                    <p class="desc">${ch.desc}</p>
                    <div class="actions">
                        <a class="btn btn-details" href="channel-details.html?id=${ch.id}">
                            View Proofs
                        </a>
                        <a class="btn btn-buy" href="https://wa.me/251961224955?text=Hello, I want to buy ${ch.title}">
                            Get Price
                        </a>
                    </div>
                </div>
            </div>
            `;
        });
    }

    // Initialize
    window.onload = () => {
        AOS.init({ duration: 800, once: true });
        renderChannels();
    };
</script>

</body>
</html>
